<script>
// Tracer: mirrors the C program in JS and records the machine state after each step.
function trace(code, fn){
  const vars=[], steps=[]; let out='';
  const api={
    decl(n,t,v){vars.push({n,t,v,a:'0x'+(0x7ffc1000+vars.length*4).toString(16)})},
    get(n){return vars.find(x=>x.n===n).v},
    set(n,v){vars.find(x=>x.n===n).v=v},
    print(s){out+=s},
    s(line,note){steps.push({line,note,out,vars:vars.map(x=>({...x}))})}
  };
  fn(api); return {code,steps};
}

{id:'l3',title:'3. Pierwszy program w C',
theory:`
<p>Program w C to <b>przepis</b>: komputer wykonuje instrukcje po kolei, od góry do dołu. Każdy program zaczyna się w funkcji <code>main</code>.</p>
<ul>
<li><code>#include &lt;stdio.h&gt;</code> – dołącza bibliotekę do wejścia/wyjścia (<code>printf</code>, <code>scanf</code>).</li>
<li><b>Zmienna</b> to nazwane miejsce w pamięci. <code>int wiek = 18;</code> znaczy: zarezerwuj pamięć na liczbę całkowitą, nazwij ją <code>wiek</code>, wpisz 18.</li>
<li>Typy: <code>int</code> (całkowite), <code>float</code>/<code>double</code> (ułamkowe), <code>char</code> (jeden znak).</li>
<li><code>printf("%d", x)</code> wypisuje; <code>%d</code> = int, <code>%f</code> = float, <code>%c</code> = znak. <code>\\n</code> to nowa linia.</li>
<li><code>scanf("%d", &amp;x)</code> wczytuje liczbę do zmiennej. <code>&amp;</code> to „adres zmiennej” – scanf musi wiedzieć, gdzie wpisać wynik.</li>
<li>Każda instrukcja kończy się średnikiem <code>;</code>.</li></ul>
<p><b>Szkielet każdego programu</b> – przepisz go, a zmieniaj tylko środek:</p>
<pre>#include &lt;stdio.h&gt;   ← dołączamy bibliotekę z printf i scanf
int main(void) {      ← tu program się zaczyna
    ...               ← Twoje instrukcje, jedna pod drugą
    return 0;         ← koniec: „wszystko poszło dobrze”
}                     ← klamry { } obejmują całą funkcję</pre>
<p>Tekst po <code>//</code> to <b>komentarz</b>: komputer go pomija, a Ty możesz w nim robić notatki.</p>
<p>Uwaga: zmienna bez wartości początkowej zawiera <b>przypadkowe śmieci</b> z pamięci. Zobacz to w przykładzie 2.</p>`,

{id:'l4',title:'4. Warunki i pętle',
theory:`
<p>Dotąd program szedł prosto w dół. <b>Instrukcje sterujące</b> pozwalają wybierać drogę (<code>if</code>) i powtarzać kod (pętle).</p>
<ul>
<li><code>if (warunek) {…} else {…}</code> – wykonuje blok tylko, gdy warunek jest prawdziwy. W C <b>0 = fałsz</b>, każda inna liczba = prawda.</li>
<li>Porównania: <code>==</code> (równe), <code>!=</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>. Łączenie: <code>&amp;&amp;</code> (i), <code>||</code> (lub), <code>!</code> (nie).</li>
<li>Pułapka: <code>if (x = 5)</code> to PRZYPISANIE (zawsze prawda), a nie porównanie. Porównuj przez <code>==</code>.</li>
<li><code>for (start; warunek; krok)</code> – gdy wiesz, ile razy powtarzać.</li>
<li><code>while (warunek)</code> – powtarza, dopóki warunek jest prawdziwy; sprawdza go PRZED każdym obrotem.</li>
<li><code>do {…} while (warunek);</code> – jak while, ale najpierw wykonuje blok, potem sprawdza. <code>break</code> przerywa pętlę.</li></ul>`,
examples:[
{title:'Przykład 1: if / else if / else',make:()=>trace([

t=>{t.s(2,'Start.');
t.decl('temp','int',15);t.s(3,'temp = 15.');
t.s(4,'Sprawdzamy: 15 > 20? NIE (fałsz), więc pomijamy cały pierwszy blok.');
t.s(6,'Sprawdzamy kolejny warunek: 15 > 10? TAK (prawda).');
t.print('Srednio\n');t.s(7,'Wykonuje się ten blok. Reszta (else) zostaje pominięta.');
t.s(11,'Koniec. Wykonał się dokładnie jeden z trzech bloków.')})},
{title:'Przykład 2: pętla for (suma 1+2+3+4)',make:()=>trace([

t.s(4,'Warunek: 5 <= 4? NIE → pętla się kończy.');

LESSONS.push({id:'l5',title:'5. Funkcje i rekurencja',
theory:`
<p><b>Funkcja</b> to nazwany kawałek programu, który możesz wywołać wiele razy. Dzięki temu dzielisz duży problem na małe części (to właśnie jest programowanie <i>proceduralne</i>).</p>
<ul>
<li>Anatomia: <code>int kwadrat(int x) { return x * x; }</code> – typ wyniku, nazwa, <b>parametry formalne</b> w nawiasie, ciało. Przy wywołaniu <code>kwadrat(3)</code> liczba 3 to <b>parametr aktualny</b>.</li>
<li>Każde wywołanie dostaje własną <b>ramkę na stosie</b>: tam leżą jej parametry i zmienne lokalne. Po powrocie ramka znika. Zobaczysz to w oknie „Stos wywołań”.</li>
<li>Parametry są przekazywane <b>przez wartość</b>: funkcja dostaje KOPIĘ, więc zmiana parametru nie zmienia zmiennej w miejscu wywołania.</li>
<li><code>void</code> – funkcja, która nic nie zwraca (to jest „procedura”).</li>
<li><b>Deklaracja</b> (prototyp) <code>int dodaj(int a, int b);</code> mówi kompilatorowi, że funkcja istnieje; <b>definicja</b> zawiera jej ciało. Funkcję trzeba zadeklarować przed pierwszym użyciem.</li>
<li><b>Zmienna globalna</b> żyje przez cały program i jest widoczna wszędzie; <b>lokalna</b> tylko w swojej funkcji (lub bloku). Globalnych używaj ostrożnie.</li>
<li><b>Rekurencja</b>: funkcja wywołuje samą siebie. Potrzebuje <b>warunku zakończenia</b>, inaczej stos się przepełni. Z <code>math.h</code> masz m.in. <code>sqrt</code>, <code>pow</code>, <code>fabs</code>.</li></ul>
<p>Możesz też zmieniać te programy w zakładce „Pracownia”.</p>`,

{q:'Ile ramek na stosie jest w najgłębszym momencie wywołania silnia(4) z main?',o:['2','3','5','4'],a:2,w:'main, silnia(4), silnia(3), silnia(2), silnia(1) – razem 5.'}
]});
const COMING=['6. Tablice i struktury','7. Wskaźniki','8. Bity, liczby i znaki','9. Pliki','10. Błędy i testowanie'];

const PRESETS=[
{n:'Suma 1..n',i:'4',c:`#include <stdio.h>

int main(void) {
    int n, suma = 0;
    printf("Podaj n: ");

    for (int i = 1; i <= n; i++) {

    return 0;
}
`},
{n:'Parzysta?',i:'7',c:`#include <stdio.h>

int main(void) {
    int x;
    scanf("%d", &x);
    if (x % 2 == 0) {
        printf("%d jest parzysta\\n", x);
    } else {
        printf("%d jest nieparzysta\\n", x);
    }
    return 0;
}
`},
{n:'Silnia',i:'5',c:`#include <stdio.h>

int main(void) {
    int n, wynik = 1;
    scanf("%d", &n);
    while (n > 1) {
        wynik *= n;
        n--;
    }
    printf("Silnia = %d\\n", wynik);
    return 0;
}
`},
{n:'Tablica',i:'',c:`#include <stdio.h>
#define N 5

int main(void) {
    int t[N] = {5, 3, 9, 1, 7};
    int maks = t[0];
    for (int i = 1; i < N; i++) {
        if (t[i] > maks) {
            maks = t[i];
        }
    }
    printf("Najwieksza: %d\\n", maks);
    return 0;
}
`},
{n:'Wskaźniki',i:'',c:`#include <stdio.h>

void zamien(int *a, int *b) {
    int tmp = *a;
    *a = *b;
    *b = tmp;
}

int main(void) {
    int x = 3, y = 7;
    zamien(&x, &y);
    printf("x=%d y=%d\\n", x, y);
    return 0;
}
`},
{n:'Plik',i:'',f:'3 7 12 5',c:`#include <stdio.h>

int main(void) {
    FILE *f = fopen("dane.txt", "r");
    if (f == NULL) {
        printf("Brak pliku\\n");
        return 1;
    }
    int x, suma = 0;
    while (fscanf(f, "%d", &x) == 1) {
        suma += x;
    }
    fclose(f);
    printf("Suma = %d\\n", suma);

`}];
function lab(m){
  m.append($('h2','','✍ Pracownia: pisz własny kod'),$('div','card','<p>Napisz program w C, kliknij <b>Uruchom</b> i oglądaj go krok po kroku, tak jak przykłady. Działa: <code>int float double char</code>, <code>printf</code>, <code>scanf</code>, <code>if/else</code>, <code>for while do</code>, <code>break continue</code>, własne funkcje i rekurencja, tablice, napisy, struktury (<code>struct</code>, <code>typedef</code>), wskaźniki, operatory bitowe, <code>#define</code>, pliki (<code>fopen fprintf fscanf</code>…), <code>assert</code>. Nie ma: <code>malloc</code>, tablic wielowymiarowych, <code>switch</code>, typów <code>long</code>/<code>short</code>. Wejście programu to <code>int main(void) { … }</code>.</p>'));
  let saved='';try{saved=localStorage.getItem('ckkcode')||''}catch(e){}
  const ta=$('textarea');ta.rows=14;ta.spellcheck=false;ta.value=saved||PRESETS[0].c;
  const inp=$('input','in');inp.value=saved?'':PRESETS[0].i;inp.placeholder='np. 7 5';
  ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}};
  ta.oninput=()=>{try{localStorage.setItem('ckkcode',ta.value)}catch(e){}};
  const fil=$('textarea');fil.rows=2;fil.spellcheck=false;fil.placeholder='np. 3 7 12 5';
  const res=$('div');
  const run=()=>{
    res.innerHTML='';
    try{
      const T=runC(ta.value,inp.value,{'dane.txt':fil.value});
      if(T.error){const d=$('div','card err');d.textContent='Program zatrzymał się z błędem – zobacz ostatni krok.';res.append(d)}
      res.append(stepper({title:'Twój program',make:()=>T}));
    }catch(e){if(!e.msg)throw e;const d=$('div','card err');d.textContent=`Błąd w linii ${e.line}: ${e.msg}`;res.append(d)}
  };
  const btns=$('div','btns'),go=$('button','pri','▶ Uruchom');go.onclick=run;btns.append(go);
  PRESETS.forEach(p=>{const b=$('button','','Przykład: '+p.n);b.onclick=()=>{ta.value=p.c;inp.value=p.i;fil.value=p.f||'';ta.oninput();run()};btns.append(b)});
  m.append(ta,$('div','','Dane wejściowe (to, co „wpisujesz na klawiaturze” dla scanf):'),inp,$('div','','Zawartość pliku dane.txt (dla fopen("dane.txt", "r")):'),fil,btns,res);
  run();
}

let prog={};try{prog=JSON.parse(localStorage.getItem('ckk')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('ckk',JSON.stringify(prog))}catch(e){}};
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
let cur=0;

function renderNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  LESSONS.forEach((l,i)=>{const b=$('button',i===cur?'on':'',l.title+(prog[l.id]!=null?` — ${prog[l.id]}/${l.quiz.length}`:''));b.onclick=()=>{cur=i;render()};nav.append(b)});
  const lb=$('button',cur==='lab'?'on':'','✍ Pracownia: własny kod');lb.onclick=()=>{cur='lab';render()};nav.append(lb);
  COMING.forEach(t=>{const b=$('button','',t+' (wkrótce)');b.disabled=true;nav.append(b)});
}
const txt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
function explainBox(code){
  const el=$('details','expl'),rows={};
  el.append($('summary','','✿ Wytłumaczenie'));
  const list=$('div'),all=explainCode(code);
  list.append($('p','why','Każdy wiersz to jedna linia kodu i jej opis „po ludzku”. Pojedyncze klamry } pominąłem: każda po prostu kończy blok otwarty wyżej. Podczas oglądania programu krok po kroku podświetla się linia, która właśnie się wykonuje.'));
  all.forEach(r=>{const d=$('div','ex'),c=$('code');c.textContent=`${r.n}: ${r.code}`;const t=$('span');t.innerHTML=txt(r.text);d.append(c,t);list.append(d);rows[r.n]=d});
  el.append(list);
  let last=null;
  return{el,mark:n=>{if(last)last.classList.remove('cur');last=rows[n]||null;if(last)last.classList.add('cur')}};
}
function stepper(ex){
  const T=ex.make(),box=$('div','card');box.append($('b','',ex.title));
  const grid=$('div','stepper');box.append(grid);
  const code=$('div','code');T.code.forEach((l,i)=>{const d=$('div');d.innerHTML=`<i>${i+1}</i>`;d.append(document.createTextNode(l));code.append(d)});
  const right=$('div'),vt=$('div'),stk=$('div','stk'),term=$('div','term'),fl=$('div','stk');right.append(vt,stk,term,fl);grid.append(code,right);
  const note=$('div','note'),btns=$('div','btns');box.append(note,btns);
  let i=-1,timer=null;
  const xb=explainBox(T.code);
  const show=()=>{
    const s=T.steps[Math.max(i,0)],p=i>0?T.steps[i-1]:null;
    xb.mark(i<0?0:s.line);
    [...code.children].forEach((d,k)=>d.classList.toggle('cur',i>=0&&k===s.line-1));
    const hdr=s.stack&&(s.stack.length>1||s.vars.some(v=>v.fr===-1));
    stk.textContent=s.stack?'Stos wywołań: '+(s.stack.join(' → ')||'(pusty)'):'';
    let h='<table><tr><th>zmienna</th><th>typ</th><th>adres</th><th>wartość</th></tr>';
    if(i<0||!s.vars.length)h+='<tr><td colspan=4 style="color:var(--mut)">(pamięć pusta)</td></tr>';
    else s.vars.forEach((v,k)=>{
      if(hdr&&(k===0||s.vars[k-1].fr!==v.fr))h+=`<tr><th colspan=4 style="background:var(--bd)">${v.fr===-1?'zmienne globalne':'ramka: '+esc(s.stack[v.fr])}</th></tr>`;
      const dv=x=>x.val!==undefined?x.val:fmt(x.v,x.t);
      const old=p&&p.vars.find(x=>x.id!==undefined?x.id===v.id:x.n===v.n);const ch=!old||dv(old)!==dv(v);h+=`<tr><td><b>${v.n}</b></td><td>${esc(v.t)}</td><td>${v.a}</td><td class="${ch&&i>0?'ch':''}">${esc(dv(v))}</td></tr>`});
    vt.innerHTML=h+'</table>';
    term.textContent=i<0?'$ ':'$ '+s.out;
    fl.textContent=i>=0&&s.files?'Pliki: '+s.files.map(f=>`${f.n} = ${JSON.stringify(f.c)}`).join('   '):'';
    note.textContent=i<0?'Kliknij „Dalej”, żeby wykonać pierwszy krok.':s.note;
    cnt.textContent=`krok ${Math.max(i+1,0)} / ${T.steps.length}`;
  };
  const go=d=>{i=Math.min(T.steps.length-1,Math.max(-1,i+d));show()};
  const stop=()=>{clearInterval(timer);timer=null;play.textContent='▶ Auto'};
  const back=$('button','','◀ Wstecz'),next=$('button','pri','Dalej ▶'),rst=$('button','','Od nowa'),play=$('button','','▶ Auto'),cnt=$('span','cnt');
  back.onclick=()=>{stop();go(-1)};next.onclick=()=>{stop();go(1)};rst.onclick=()=>{stop();i=-1;show()};
  play.onclick=()=>{if(timer)return stop();if(i>=T.steps.length-1)i=-1;play.textContent='❚❚ Stop';timer=setInterval(()=>{if(i>=T.steps.length-1)stop();else go(1)},1400)};
  btns.append(back,next,play,rst,cnt);box.append(xb.el);show();return box;
}
const norm=s=>s.replace(/\s+/g,' ').trim();
// Rewards for solved tasks: the first solved task always gets the first picture, the next ones the following pictures.
const REWARDS=['nagrody/kot1.png','nagrody/moje01.png','nagrody/moje02.webp','nagrody/moje03.png','nagrody/moje04.png','nagrody/moje05.webp','nagrody/moje06.webp','nagrody/moje07.png','nagrody/moje08.png','nagrody/moje09.png','nagrody/moje10.webp','nagrody/moje11.png','nagrody/piesek2.png','nagrody/piesek3.png'];
function rewardFor(key){
  let d=[];try{d=JSON.parse(localStorage.getItem('ckkdone')||'[]')}catch(e){}
  if(!d.includes(key)){d.push(key);try{localStorage.setItem('ckkdone',JSON.stringify(d))}catch(e){}}
  return REWARDS[d.indexOf(key)%REWARDS.length];
}
function taskBox(t){
  const box=$('div','card'),h=$('h3','','✏️ Twoje zadanie: '+esc(t.title));h.style.marginTop='0';
  box.append(h,$('div','',t.desc));
  const ta=$('textarea');ta.rows=Math.min(20,t.starter.split('\n').length+1);ta.spellcheck=false;ta.value=t.starter;
  ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}};
  const out=$('div'),stepRes=$('div'),hint=$('div','note'),sol=$('pre');
  hint.hidden=sol.hidden=true;hint.textContent='Podpowiedź: '+t.hint;sol.textContent=t.sol;
  const check=()=>{
    out.innerHTML='';let ok=0;const list=$('div');
    t.tests.forEach(c=>{
      const dane=c.f?`plik dane.txt = „${Object.values(c.f)[0]}”`:c.i?`dane: „${c.i}”`:'bez danych';let good=false,msg;
      try{
        const T=runC(ta.value,c.i||'',c.f),got=T.steps[T.steps.length-1].out;
        if(T.error)msg=`${dane}: błąd – ${T.error}`;
        else if(norm(got)===norm(c.o)){good=true;ok++;msg=`${dane} → ${c.o}`}
        else msg=`${dane}: oczekiwano „${c.o}”, ${norm(got)?`a program wypisał „${norm(got)}”`:'a program nic nie wypisał'}`;
      }catch(e){if(!e.msg)throw e;msg=`błąd w linii ${e.line}: ${e.msg}`}
      const d=$('div');d.textContent=(good?'✔ ':'✘ ')+msg;d.style.color=good?'var(--ok)':'var(--bad)';list.append(d);
    });
    const sum=$('b');sum.textContent=ok===t.tests.length?'🎉 Brawo, zadanie zaliczone!':`Zaliczone testy: ${ok} z ${t.tests.length}. Popraw program i sprawdź jeszcze raz.`;
    out.append(list,sum);
    if(ok===t.tests.length){
      const im=$('img');im.src=rewardFor(t.title);im.alt='Nagroda: słodkie zdjęcie';
      im.style.cssText='display:block;max-width:min(340px,100%);max-height:420px;object-fit:cover;border-radius:14px;margin:10px 0;border:3px solid var(--bd)';
      out.append(im);
    }
  };
  const watch=()=>{
    stepRes.innerHTML='';const c=t.tests[0];
    try{stepRes.append(stepper({title:'Twój program (dane z testu 1)',make:()=>runC(ta.value,c.i||'',c.f)}))}
    catch(e){if(!e.msg)throw e;const d=$('div','card err');d.textContent=`Błąd w linii ${e.line}: ${e.msg}`;stepRes.append(d)}
  };
  const btn=(label,cls,fn)=>{const b=$('button',cls,label);b.onclick=fn;return b};
  const btns=$('div','btns');
  btns.append(btn('✔ Sprawdź','pri',check),btn('▶ Zobacz krok po kroku','',watch),
    btn('💡 Podpowiedź','',()=>{hint.hidden=!hint.hidden}),btn('Pokaż rozwiązanie','',()=>{sol.hidden=!sol.hidden}),
    btn('Wróć do szablonu','',()=>{ta.value=t.starter}));
  box.append(ta,btns,out,hint,sol,stepRes);return box;
}
function quiz(l){
  const box=$('div','card');box.append($('h3','','Sprawdź się'));
  let right=0,done=0;const score=$('div','score');
  l.quiz.forEach((q,qi)=>{
    const qb=$('div');qb.append($('p','',`<b>${qi+1}.</b> `));qb.firstChild.append(document.createTextNode(q.q));
    const why=$('div','why');let locked=false;
    q.o.forEach((o,oi)=>{const b=$('button','opt');b.textContent=o;b.onclick=()=>{
      if(locked)return;locked=true;done++;
      b.classList.add(oi===q.a?'ok':'bad');if(oi===q.a)right++;else qb.querySelectorAll('.opt')[q.a].classList.add('ok');
      why.textContent=(oi===q.a?'✔ Dobrze. ':'✘ Nie. ')+q.w;
      if(done===l.quiz.length){score.textContent=`Wynik: ${right}/${l.quiz.length}`+(right===l.quiz.length?' 🎉':' – wróć do przykładów i spróbuj jeszcze raz.');prog[l.id]=Math.max(prog[l.id]||0,right);save();renderNav()}};qb.append(b)});
    qb.append(why);box.append(qb)});
  box.append(score);return box;
}
function render(){
  renderNav();const m=document.getElementById('main');m.innerHTML='';
  if(cur==='lab'){lab(m);window.scrollTo(0,0);return}
  const l=LESSONS[cur];
  m.append($('h2','',l.title),$('div','card',l.theory));
  if(l.widget)m.append(l.widget());
  m.append($('h3','','Zobacz, jak to działa'));
  l.examples.forEach(e=>m.append(stepper(e)));
  if(l.tasks)l.tasks.forEach(t=>m.append(taskBox(t)));
  m.append(quiz(l));window.scrollTo(0,0);
}
addEventListener('DOMContentLoaded',render);
</script>
